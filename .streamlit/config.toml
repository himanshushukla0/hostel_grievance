[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[global]
minCachedMessageSize = 1000000000
maxCachedMessageAge = 0

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
